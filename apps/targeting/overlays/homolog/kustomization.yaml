apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: sha-268a3fbde001
    includeSelectors: false
    includeTemplates: true
images:
  - name: togglemaster-targeting-service
    newName: 434271199872.dkr.ecr.us-east-1.amazonaws.com/togglemaster-homolog/targeting-service
    newTag: sha-268a3fbde001
patches:
  - target:
      kind: ConfigMap
      name: targeting-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
