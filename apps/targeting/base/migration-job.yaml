apiVersion: batch/v1
kind: Job
metadata:
  name: targeting-db-migrate
  labels:
    app.kubernetes.io/name: targeting-service
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: togglemaster
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: targeting-service
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: togglemaster
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: migrate
          image: migrate/migrate:v4.19.1
          imagePullPolicy: IfNotPresent
          args:
            - -path=/migrations
            - -database=$(DATABASE_URL)
            - -lock-timeout=60
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: targeting-db-migrations
