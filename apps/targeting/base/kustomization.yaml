apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - migration-job.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: targeting-db-migrations
    files:
      - migrations/000001_create_targeting_rules.up.sql
      - migrations/000001_create_targeting_rules.down.sql
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
