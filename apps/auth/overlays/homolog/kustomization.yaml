apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: sha-ef0973c608dc
    includeSelectors: false
    includeTemplates: true
images:
  - name: togglemaster-auth-service
    newName: 434271199872.dkr.ecr.us-east-1.amazonaws.com/togglemaster-homolog/auth-service
    newTag: sha-ef0973c608dc
patches:
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
