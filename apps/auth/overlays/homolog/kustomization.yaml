apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
images:
  - name: togglemaster-auth-service
    newName: /togglemaster-homolog/auth-service
    newTag: sha-6559b8ccff61
patches:
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
