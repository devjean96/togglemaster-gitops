apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: togglemaster
    app.kubernetes.io/version: sha-0000000
spec:
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: togglemaster
        app.kubernetes.io/version: sha-0000000
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: analytics-service
          image: togglemaster-analytics-service:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          envFrom:
            - configMapRef:
                name: analytics-service-config
          env:
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: analytics-service-config
                  key: ENVIRONMENT
            - name: SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=togglemaster,deployment.environment.name=$(DEPLOYMENT_ENVIRONMENT),service.version=$(SERVICE_VERSION)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
