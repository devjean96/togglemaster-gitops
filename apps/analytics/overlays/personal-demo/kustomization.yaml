apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: sha-929e9fd268db
    includeSelectors: false
    includeTemplates: true
images:
  - name: togglemaster-analytics-service
    newName: 335924543883.dkr.ecr.us-east-2.amazonaws.com/togglemaster-homolog/analytics-service
    newTag: sha-929e9fd268db
patches:
  - target:
      kind: ConfigMap
      name: analytics-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
      - op: replace
        path: /data/AWS_DYNAMODB_TABLE
        value: ToggleMasterAnalytics-homolog
      - op: replace
        path: /data/AWS_SQS_URL
        value: https://sqs.us-east-2.amazonaws.com/335924543883/togglemaster-homolog-evaluation-events
      - op: replace
        path: /data/AWS_REGION
        value: us-east-2
  - target:
      kind: Deployment
      name: analytics-service
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/envFrom/1
  - target:
      kind: HorizontalPodAutoscaler
      name: analytics-service
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
