apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: sha-2f299d37f062
    includeSelectors: false
    includeTemplates: true
images:
  - name: togglemaster-analytics-service
    newName: 483314471129.dkr.ecr.us-east-1.amazonaws.com/togglemaster-homolog/analytics-service
    newTag: sha-2f299d37f062
patches:
  - target:
      kind: ConfigMap
      name: analytics-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
      - op: replace
        path: /data/AWS_DYNAMODB_TABLE
        value: ToggleMasterAnalytics-homolog
      - op: replace
        path: /data/AWS_SQS_URL
        value: https://sqs.us-east-1.amazonaws.com/483314471129/togglemaster-homolog-evaluation-events
  - target:
      kind: HorizontalPodAutoscaler
      name: analytics-service
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
