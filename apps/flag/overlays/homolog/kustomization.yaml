apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
images:
  - name: togglemaster-flag-service
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/togglemaster-homolog/flag-service
    newTag: sha-0000000
patches:
  - target:
      kind: ConfigMap
      name: flag-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
