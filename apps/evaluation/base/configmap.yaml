apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-service-config
  labels:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/part-of: togglemaster
data:
  PORT: "8004"
  ENVIRONMENT: base
  REDIS_URL: rediss://REPLACE_WITH_REDIS_ENDPOINT:6379
  FLAG_SERVICE_URL: http://flag-service:8002
  TARGETING_SERVICE_URL: http://targeting-service:8003
  AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/REPLACE_WITH_QUEUE
  AWS_REGION: us-east-1
  OTEL_SERVICE_NAME: evaluation-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"

