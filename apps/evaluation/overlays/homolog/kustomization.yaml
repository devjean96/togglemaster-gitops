apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: sha-9f58c5d83c11
    includeSelectors: false
    includeTemplates: true
images:
  - name: togglemaster-evaluation-service
    newName: 434271199872.dkr.ecr.us-east-1.amazonaws.com/togglemaster-homolog/evaluation-service
    newTag: sha-9f58c5d83c11
patches:
  - target:
      kind: ConfigMap
      name: evaluation-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
      - op: replace
        path: /data/REDIS_URL
        value: rediss://master.togglemaster-homolog-redis.mjdgbj.use1.cache.amazonaws.com:6379
      - op: replace
        path: /data/AWS_SQS_URL
        value: https://sqs.us-east-1.amazonaws.com/434271199872/togglemaster-homolog-evaluation-events
  - target:
      kind: HorizontalPodAutoscaler
      name: evaluation-service
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
