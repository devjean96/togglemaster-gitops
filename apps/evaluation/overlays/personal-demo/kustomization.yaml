apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: togglemaster-homolog
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: homolog
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: sha-e0a54044fc24
    includeSelectors: false
    includeTemplates: true
images:
  - name: togglemaster-evaluation-service
    newName: 335924543883.dkr.ecr.us-east-2.amazonaws.com/togglemaster-homolog/evaluation-service
    newTag: sha-e0a54044fc24
patches:
  - target:
      kind: ConfigMap
      name: evaluation-service-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: homolog
      - op: replace
        path: /data/REDIS_URL
        value: rediss://master.togglemaster-homolog-redis.8w8eip.use2.cache.amazonaws.com:6379
      - op: replace
        path: /data/AWS_SQS_URL
        value: https://sqs.us-east-2.amazonaws.com/335924543883/togglemaster-homolog-evaluation-events
      - op: replace
        path: /data/AWS_REGION
        value: us-east-2
  - target:
      kind: Deployment
      name: evaluation-service
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/envFrom/1
  - target:
      kind: HorizontalPodAutoscaler
      name: evaluation-service
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
