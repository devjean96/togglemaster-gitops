apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: togglemaster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - app: auth
            path: apps/auth
          - app: flag
            path: apps/flag
          - app: targeting
            path: apps/targeting
          - app: evaluation
            path: apps/evaluation
          - app: analytics
            path: apps/analytics
          - app: ingress
            path: platform/ingress
  template:
    metadata:
      name: '{{.app}}-homolog'
      labels:
        app.kubernetes.io/part-of: togglemaster
        app.kubernetes.io/environment: homolog
    spec:
      project: togglemaster
      source:
        repoURL: https://github.com/devjean96/togglemaster-gitops.git
        targetRevision: main
        path: '{{.path}}/overlays/homolog'
      destination:
        server: https://kubernetes.default.svc
        namespace: togglemaster-homolog
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false
