apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: togglemaster-observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  sources:
    # Chart oficial com versao fixa (upgrade = Pull Request mudando esta linha)
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.4.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/platform/observability/values/grafana.yaml
    # Values versionados neste repositorio
    - repoURL: https://github.com/devjean96/togglemaster-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
