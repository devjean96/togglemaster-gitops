apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: togglemaster-observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  # Dashboards, regras de alerta, contact points e o self-healer.
  source:
    repoURL: https://github.com/devjean96/togglemaster-gitops.git
    targetRevision: main
    path: platform/observability/config
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
