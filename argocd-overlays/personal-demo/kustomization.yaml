apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../argocd
patches:
  - target:
      kind: ApplicationSet
      name: togglemaster
    patch: |-
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: codex/aws-temporary-demo
      - op: replace
        path: /spec/template/spec/source/path
        value: '{{.path}}/overlays/personal-demo'
  - target:
      kind: Application
      name: observability-config
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: codex/aws-temporary-demo
  - target:
      kind: Application
      name: grafana-contactpoints
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: codex/aws-temporary-demo
  - target:
      kind: Application
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/sources/1/targetRevision
        value: codex/aws-temporary-demo
  - target:
      kind: Application
      name: grafana
    patch: |-
      - op: replace
        path: /spec/sources/1/targetRevision
        value: codex/aws-temporary-demo
